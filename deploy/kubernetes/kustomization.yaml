apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secrets are not part of these manifests; create switchyard-config and
# switchyard-provider-keys out of band (see README.md).
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: switchyard
    includeSelectors: true
  - pairs:
      app.kubernetes.io/part-of: switchyard

images:
  - name: switchyard
    newTag: dev
